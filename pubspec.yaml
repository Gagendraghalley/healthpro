# Health Pro workspace (Dart pub workspace): one Flutter app built from a
# shared core and one package per module. Run `flutter pub get` here once;
# it resolves every package below together.
name: health_pro_workspace
publish_to: 'none'

environment:
  sdk: ^3.6.0

workspace:
  - apps/health_pro_app
  - packages/health_pro_core
  - packages/gym_membership
