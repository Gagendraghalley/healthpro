<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0A1C45;">
  <h2 style="margin: 0 0 8px;">Your Health Pro code</h2>
  <p style="margin: 0 0 20px; color: #5B6478;">Copy this code, or type it, in the Health Pro app or website:</p>
  <!-- One word with no spaces (the gaps are letter-spacing), so a copy gives just the digits; one tap selects it all. -->
  <p style="margin: 0 0 20px;"><span style="display: inline-block; padding: 10px 6px 10px 16px; border-radius: 12px; background: #FFF3EA; font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 34px; font-weight: 800; letter-spacing: 10px; color: #F86A0C; -webkit-user-select: all; user-select: all;">{{ .Token }}</span></p>
  <p style="margin: 0; color: #5B6478;">It works for one hour. If you didn't ask for it, you can ignore this email.</p>
</div>
