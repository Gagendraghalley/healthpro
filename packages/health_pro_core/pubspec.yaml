name: health_pro_core
description: What every Health Pro module shares - accounts, profiles, venues and their staff, payments, notifications, the module contract, the router and the app shell.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  qr_flutter: ^4.1.0 # everyone's Health Pro QR code (My QR code)
  share_plus: ^12.0.2 # shares or saves their QR code's picture from My dashboard
  clipboard: ^3.0.10 # copies their QR code's picture from My dashboard
  flutter_map: ^8.3.2 # a venue's place on an OpenStreetMap map (no API key)
  latlong2: ^0.10.1 # flutter_map's coordinates
  geolocator: ^14.0.2 # gyms near me, and pinning a venue where you stand
  video_player: ^2.10.0 # plays a venue's promotional video (its own short clip)
  archive: ^4.0.0 # zips the Excel files that staff export (Spreadsheet)
  http: ^1.2.0 # asks Supabase Auth whether Google sign-in is on (googleSignInProvider)
  firebase_core: ^5.1.0 # push notifications on the Android and iOS apps (Firebase Cloud Messaging)
  firebase_messaging: ^17.0.1 # ...the phone's token, and opening a notification's page

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Used as Image.asset(..., package: 'health_pro_core') (HealthProLogo, and
  # the sign-in pages' photo, AuthLayout.photo: assets/PHOTO_CREDITS.md).
  assets:
    - assets/images/
    - assets/auth/
    # The menu's 3D icons: Microsoft's Fluent Emoji 3D, MIT (assets/icons3d/LICENSE.txt), at 96px.
    - assets/icons3d/
    # A 3D picture for each service icon (VenueTypeIcons.art), same source and licence, at 160px.
    - assets/services3d/
  fonts:
    # The platform's typeface, every service's (brandFont, used as
    # 'packages/health_pro_core/PlusJakartaSans'). Plus Jakarta Sans, SIL Open
    # Font License (assets/fonts/OFL.txt).
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
